[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngila"
version = "0.1.0"
description = "Reproducible evaluation of refusal, factuality, and calibration under model interventions"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["datasets>=3", "huggingface_hub>=0.27", "pyarrow>=15"]
model = ["torch>=2.7", "transformers>=5.0", "accelerate>=1.0", "safetensors>=0.4"]

[project.scripts]
ngila = "ngila.cli:main"

[tool.setuptools.packages.find]
include = ["ngila*"]
